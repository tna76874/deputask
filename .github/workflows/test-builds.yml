# Prüft jedes Release: Prüfsummen, Server und Desktop-Programme starten.
name: Test Executable Starts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version.json ist gültig und passt zu allen Dateien in builds/
        run: |
          set -eu
          jq -e '.format == 1 and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+")) and (.files | length > 0)' version.json
          jq -r '.files[] | "\(.sha256)  \(.path)"' version.json > /tmp/sums
          sha256sum -c /tmp/sums
          diff <(sort /tmp/sums) <(sort SHA256SUMS)
          # jede Datei in builds/ steht in version.json, mit der richtigen Größe
          for f in builds/*; do
            jq -e --arg p "$f" --argjson s "$(stat -c %s "$f")" '.files[] | select(.path == $p and .size == $s)' version.json > /dev/null \
              || { echo "$f fehlt in version.json oder hat eine andere Größe"; exit 1; }
          done

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server startet und meldet die Version aus version.json
        run: |
          set -eu
          chmod +x builds/deputask-server-linux-amd64
          ./builds/deputask-server-linux-amd64 -version
          ./builds/deputask-server-linux-amd64 -addr 127.0.0.1:8080 -db /tmp/deputask.db -demo &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          test "$(jq -r .version /tmp/health.json)" = "$(jq -r .version version.json)"
          curl -fsS http://127.0.0.1:8080/api/about | jq -e '.copyright.holder != ""'

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Wails Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libglib2.0-0 \
            libglu1-mesa \
            xvfb

      - name: Make Linux binary executable
        run: chmod +x builds/deputask-linux-amd64

      - name: Test Linux Binary (Headless via Xvfb)
        run: |
          echo "Testing Wails Linux AMD64 build..."
          xvfb-run --auto-servernum ./builds/deputask-linux-amd64 --help || [ $? -eq 124 ]

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Windows AMD64 Binary
        run: |
          Write-Host "Testing Windows AMD64 build..."
          # Startet die exe und fängt ab, ob sie sofort mit einem Fehlercode stirbt
          try {
              $process = Start-Process -FilePath "builds\deputask-windows-amd64.exe" -ArgumentList "--help" -PassThru -NoNewWindow
              Start-Sleep -Seconds 3
              if (!$process.HasExited) {
                  $process.Kill()
              }
          } catch {
              Write-Host "Process check completed or timed out."
          }

      - name: Test Windows ARM64 Binary
        run: |
          Write-Host "Testing Windows ARM64 build..."
          # Windows-Runner auf GitHub sind x64, ARM64-Exes können dort 
          # oft nicht ausgeführt werden (kein ARM-Host). Wir prüfen hier nur, ob sie existieren.
          if (Test-Path "builds\deputask-windows-arm64.exe") {
              Write-Host "ARM64 binary is present (native execution on x64 runner skipped)."
          }
