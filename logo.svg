    DepuTask-Logo – die EINZIGE Quelle. Alle anderen Logo-Dateien werden beim Bauen daraus erzeugt
    (make logo, siehe branding/README.md). Hier ändern, nirgends sonst.
    Für das Rastern der Desktop-Icons (oksvg) nur path und linearGradient (Einheiten relativ zur Form)
